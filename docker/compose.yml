services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: eoq
      POSTGRES_PASSWORD: eoq_dev_password
      POSTGRES_DB: end_of_question
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U eoq -d end_of_question']
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  postgres_data:
